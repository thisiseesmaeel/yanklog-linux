app-id: com.yanklog.YankLog
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: yanklog

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: yanklog
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/yanklog/cargo
    build-commands:
      - export CARGO_BIN="$(find "$(pwd)" -maxdepth 4 -type f -path '*/rust-1.85.0-*/cargo/bin/cargo' | head -1)"
        && export RUSTDIR="$(dirname "$(dirname "$CARGO_BIN")")"
        && export PATH="$RUSTDIR/cargo/bin:$RUSTDIR/rustc/bin:$PATH"
        && cargo build --release --offline --locked -p yanklog-linux-native --features flatpak --bin yanklog
      - install -Dm755 target/release/yanklog /app/bin/yanklog
      - install -Dm644 packaging/flatpak/com.yanklog.YankLog.desktop /app/share/applications/com.yanklog.YankLog.desktop
      - install -Dm644 assets/logo.svg /app/share/icons/hicolor/scalable/apps/com.yanklog.YankLog.svg
      - install -Dm644 packaging/flatpak/com.yanklog.YankLog.metainfo.xml /app/share/metainfo/com.yanklog.YankLog.metainfo.xml
      - install -Dm644 LICENSES/MIT.txt /app/share/licenses/com.yanklog.YankLog/MIT.txt
    sources:
      - type: dir
        path: ../..
      - generated-sources.json
      - type: archive
        archive-type: tar-xz
        url: https://static.rust-lang.org/dist/rust-1.85.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: 6f8b323ed2a34ccf0031631b85d79e1133da662094566bc910432da9bd3a5b42
      - type: archive
        archive-type: tar-xz
        url: https://static.rust-lang.org/dist/rust-1.85.0-aarch64-unknown-linux-gnu.tar.xz
        sha256: 024918027c349bd237617a8a1207d7c4462f70549a31e8bf6c14b0601cfd489e
