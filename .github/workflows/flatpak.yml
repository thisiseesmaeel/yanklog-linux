name: Build Flatpak

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Refresh Flathub remote
        run: |
          flatpak --system remote-delete flathub || true
          flatpak --system remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Pre-install Rust SDK extension
        run: |
          for attempt in 1 2 3; do
            if flatpak --system install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep 10
          done
          echo "Failed to install Rust SDK extension after 3 attempts"
          exit 1
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: yanklog-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/com.yanklog.YankLog.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          arch: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: flatpak-bundle-${{ matrix.arch }}
          path: yanklog-${{ matrix.arch }}.flatpak
